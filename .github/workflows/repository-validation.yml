name: Repository validation

on:
  push:
  pull_request:

jobs:
  validate-scaffold:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify required lifecycle files
        shell: bash
        run: |
          required=(README.md TASK.md STATUS.md AGENTS.md CLAUDE.md CODEX.md)
          for path in "${required[@]}"; do
            test -f "$path" || { echo "Missing required file: $path"; exit 1; }
          done
